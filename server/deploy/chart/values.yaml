# Overlay from the parent dump supplies registry (ECR host) via --set.
# Do not put account ids or DSNs here.
replicaCount: 1
registry: ""
image:
  repository: federationcoin-radar
  tag: testnet-latest
  pullPolicy: Always
host: radar-api.federationcoin.org
ingress:
  group: federationcoin-https
certificateArn: ""
wafAclArn: ""
serviceAccount:
  create: false
  name: federationcoin-radar
collectorServiceAccount:
  create: false
  name: federationcoin-radar-collector
# Secrets Manager names (JSON blobs). Do not put SecretString here.
secret:
  name: federationcoin/radar-api
collectorSecret:
  name: federationcoin/radar-collector
port: 8080
schedule: "0 * * * *"
